name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5.4.0
        with:
          go-version: '1.21' 
          check-latest: true 
          cache: true 
          cache-dependency-path: go.sum  

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
